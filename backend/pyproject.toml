[project]
name = "werewolf-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "aiomysql", "bcrypt", "python-jose[cryptography]", "greenlet",
	  "fastapi>=0.115",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["llm: hits the real LLM (slow, requires API key)"]
